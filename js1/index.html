<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JS Exercise 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>JS Exercise 1</h1>

  <div class="row">
    <label for="num1">Enter First Number:</label>
    <input type="number" id="num1">
  </div>

  <div class="row">
    <label for="num2">Enter Second Number:</label>
    <input type="number" id="num2">
  </div>

  <div class="row">
    <button id="calcBtn">Calculate</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div class="results">
    <p><span class="label">Sum:</span><span id="sum"></span></p>
    <p><span class="label">Difference:</span><span id="difference"></span></p>
    <p><span class="label">Product:</span><span id="product"></span></p>
    <p><span class="label">Quotient:</span><span id="quotient"></span></p>
  </div>

  <script src="main.js"></script>

</body>
</html>
